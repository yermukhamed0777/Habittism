name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --deny-warnings

      - name: Type-check & build
        run: npm run build

      - name: Verify pure logic rules
        run: npm run test:logic

      - name: Verify PostgreSQL row ownership
        run: npm run test:rls

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile journal flows
        run: npm run test:e2e

      - name: Verify data-integrity and recovery scenarios
        run: npm run test:integrity

      - name: Verify install assets and offline guest mode (base /)
        run: npm run test:pwa

      - name: Verify installable Pages build (base /Hexis/)
        run: npm run verify:pages

      - name: Upload Vercel-shaped build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-vercel
          path: dist/
          retention-days: 7

      - name: Upload Pages-shaped build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-pages
          path: dist-pages/
          retention-days: 7
